[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "crx-python"
version = "0.3.0"
description = "Python SDK for the CRX FX forwards venue"
readme = "README.md"
license = { text = "LicenseRef-CRX-Proprietary" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "eth-account>=0.13",
    "eth-abi>=5",
    "eth-utils>=4",
]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/crxfoundation/crx-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crx = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to the live gateway (opt-in: CRX_LIVE=1)"]
